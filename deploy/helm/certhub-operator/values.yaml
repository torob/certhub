nameOverride: ""
fullnameOverride: ""

replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: ghcr.io/torob/certhub-operator
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

clusterScoped: false

# Exact namespaces to watch in namespaced mode. An empty list uses the Helm
# release namespace. Leave empty when clusterScoped=true.
watchNamespaces: []

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

certhub:
  url: ""
  # The token Secret must exist in the Helm release namespace. Its value is
  # injected into the operator as CERTHUB_TOKEN without operator Secret RBAC.
  tokenSecretName: certhub-token
  tokenSecretKey: token
  # Periodic certificate resync; the operator accepts values of at least 30s.
  resyncInterval: 6h
  # Base of the per-Certificate exponential failure backoff.
  reconcileBackoff: 1m
  httpTimeout: 30s
  httpRetryMaxAttempts: 5
  httpRetryInitialBackoff: 1s
  httpRetryMaxBackoff: 8s
  # Additional PEM CA certificates to trust, for a Certhub server certificate
  # from a private CA. Set configMapName or secretName, not both. The object
  # must exist in the Helm release namespace and contain the key. The chart
  # mounts only that key read-only at /etc/certhub/ca-bundle/ca.crt and sets
  # SSL_CERT_DIR=/etc/ssl/certs:/etc/pki/tls/certs:/etc/certhub/ca-bundle.
  # The image CA bundle stays trusted. The operator process trusts the added
  # CAs for all its TLS connections. Empty names add nothing.
  caBundle:
    configMapName: ""
    secretName: ""
    key: ca.crt

metrics:
  service:
    enabled: true
    port: 8080
    annotations: {}
    labels: {}
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    interval: 30s
    scrapeTimeout: 10s

networkPolicy:
  # Enable a network policy selecting only this release's operator pod.
  enabled: false

  # Supported providers are "kubernetes" and "cilium". Only the selected
  # provider's resource is rendered.
  provider: cilium

  kubernetes:
    # Native networking.k8s.io/v1 NetworkPolicy ingress rules.
    #
    # null/omitted: omit spec.ingress and do not isolate ingress.
    # []: render spec.ingress: [] and isolate ingress with no allowed traffic.
    # - {}: allow all ingress under Kubernetes NetworkPolicy semantics.
    ingress:

    # Native networking.k8s.io/v1 NetworkPolicy egress rules.
    #
    # null/omitted: omit spec.egress and do not isolate egress.
    # []: render spec.egress: [] and isolate egress with no allowed traffic.
    # - {}: allow all egress under Kubernetes NetworkPolicy semantics.
    egress:

  cilium:
    # Native Cilium ingress rules. Rules may use fromEndpoints, fromCIDR,
    # fromCIDRSet, fromEntities, and toPorts.
    #
    # null/omitted: omit spec.ingress.
    # []: render an empty spec.ingress list.
    # - {}: render one empty native Cilium ingress rule.
    ingress:

    # Native Cilium egress rules. Rules may use toEndpoints, toCIDR,
    # toCIDRSet, toEntities, toServices, toFQDNs, and toPorts.
    #
    # null/omitted: omit spec.egress.
    # []: render an empty spec.egress list.
    # - {}: render one empty native Cilium egress rule.
    egress:

resources: {}

# Additional operator container environment variables (Kubernetes EnvVar
# list). Entries come after the chart variables. The chart rejects an entry
# that redefines a variable it sets: CERTHUB_URL, CERTHUB_TOKEN,
# WATCH_NAMESPACES, CERTHUB_METRICS_BIND_ADDR, CERTHUB_RESYNC_INTERVAL,
# CERTHUB_RECONCILE_BACKOFF, CERTHUB_HTTP_TIMEOUT,
# CERTHUB_HTTP_RETRY_MAX_ATTEMPTS, CERTHUB_HTTP_RETRY_INITIAL_BACKOFF,
# CERTHUB_HTTP_RETRY_MAX_BACKOFF, and SSL_CERT_DIR when certhub.caBundle is
# set. Use the dedicated values for these.
extraEnv: []

# Additional pod volumes (Kubernetes Volume list).
extraVolumes: []

# Additional operator container volume mounts (Kubernetes VolumeMount list).
# The root filesystem is read-only, so mount writable paths explicitly.
extraVolumeMounts: []

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
terminationGracePeriodSeconds: 30

probes:
  liveness:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
